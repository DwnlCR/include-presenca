services:
  postgres:
    image: postgres:16-alpine
    container_name: include_presenca_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: include_presenca
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: includepresenca
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
